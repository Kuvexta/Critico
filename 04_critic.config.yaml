# --- Sub-perfil ops.cosecha — normativa del bundle (CAMBIO PROP-COSECHA-001 · v3.5.0) ---
# Mapeo C01–C13 a IDs reales de la rúbrica (diseño v3 §5) + composición (v4 §5, v5 §2.2):
# C02 compuesto (NO alias de consistency), C07 AND con reporte separado,
# C11 condicional por tipo, C12/C13 advisory con escalado Beta/Wilson.
cosecha_prc:
  domain: prc
  sub_profile_id: ops.cosecha
  pointer_enforcement_strict: true
  snapshot_hash_validation: true
  p29_matrix:
    binary: true
    obliga_ficha_si: [recurrente, multi_agente, toca_canonicos]
    bypass_si: "ninguno de los tres → BYPASS automático registrado (muestreo 10% auditado)"
  conditions_schema: "v2.1: {cond_id, tipo, verificable_por, iteracion_limite, estado, efecto_bloqueante}"
  slots:
    C01: { dimensions: [30], severity: bloqueante, act: core, composicion: "evidencia rastreable para cada afirmación (bundle: n, w, hashes)" }
    C02: { dimensions: [3], severity: bloqueante, act: core, composicion: "compuesto: consistencia ∧ no-inferioridad con δ; replay comparativo como evidencia separada (NO alias de consistency)" }
    C03: { dimensions: [32], severity: bloqueante, act: opt, composicion: "replay reproducible con hashes" }
    C04: { dimensions: [100], severity: bloqueante, act: opt, composicion: "dedup P20 por bandas (identidad=FAIL, similitud alta=REVIEW_QUEUE)" }
    C05: { dimensions: [50], severity: bloqueante, act: core, composicion: "linaje y hashes de entradas/salidas" }
    C06: { dimensions: [9], severity: bloqueante, act: core, composicion: "contrato de salida declarado y cumplido" }
    C07: { dimensions: [88, 57], severity: bloqueante, act: core, composicion: "AND — 88 secrets_management y 57 pii_handling independientes, ambas bloqueantes; se reportan por separado" }
    C08: { dimensions: [44], severity: bloqueante, act: dom, composicion: "idioma P27: IDs EN, prosa ES" }
    C09: { dimensions: [55], severity: bloqueante, act: dom, composicion: "transición de estado con versión y traza" }
    C10: { dimensions: [41], severity: bloqueante, act: core, composicion: "precondición de skill (solo skills)" }
    C11: { dimensions: [23], severity: condicional, act: opt, composicion: "diversidad de contextos", regla: "bloqueante si tipo ∈ {SKILL_*}; advisory si tipo ∈ {PROMPT_CANONICO, DEGRADAR}" }
    C12: { dimensions: [79], severity: advisory, act: opt, composicion: "calibración del perfil", escalado: "Advisory→Bloqueante si surprise_rate fuera de banda: Beta/Wilson, n_min_baseline=50, baseline rodante 4 semanas, baseline_version registrada" }
    C13: { dimensions: [17, 106], severity: advisory, act: core, composicion: "impacto en ramas vivas (blast_radius + second_order_effects)", escalado: "Advisory→Bloqueante (Beta/Wilson, baseline_version propia); C12 y C13 escalan por separado" }

# --- Estados y transiciones ---
states:
  terminal: [PASA, PASA_CON_CONDICIONES, NO_PASA, RIESGO_NO_EVALUADO]
  operational_suspension: [NECESITA_INFO, REVISION_PARCIAL]
# --- Métricas de salud ---
metrics:
  discovery_rate:          { formula: "implicit_assumptions_discovered / artifacts_reviewed", target: ">= 2.0" }
  gate_c_acceptance:       { formula: "objections_accepted / objections_emitted",              target: ">= 0.6" }
  false_positive_blocker:  { formula: "blockers_rejected / blockers_emitted",                  target: "<= 0.15" }
  audit_trail_coverage:    { formula: "PASA_with_trail / PASA_total",                          target: "== 1.0" }
  suspension_reopen_valid: { formula: "reopened_valid / reopened_total",                       target: ">= 0.9" }
  skip_incident_rate:      { formula: "active_skip_incidents / artifacts_reviewed",            target: "== 0.0" }
