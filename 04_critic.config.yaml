# ============================================================
# critic.config.yaml — Crítico v3.6.0 (M1 ángulo 15 · M2 Pre-Report Gate · M3 scorecard)
# ============================================================
critic_version: 3.6.0
config_hash: "b9532948575b71f5d981ec170142abb86951992ecc34c979b1ecc7dfe6e15a77"
frozen: true
# --- Guardrails de ejecución ---
execution:
  budget:
    tokens_max: 150000
    time_seconds_max: 900
    llm_calls_max: 20
  max_objections_per_round: 10
  max_active_dimensions: 40
  max_suspension_cycles: 2
  suspension_timeout_hours: 48
  kill_switch:
    same_objections_repeated_threshold: 2
    on_trigger: escalate_to_human
# --- Reglas de suspensión (M3) ---
suspension:
  reset_conditions:
    requires_artifact_hash_change: true
    requires_previous_questions_resolved_in_triage: true
# --- Invariantes de validación ---
validation:
  invariants:
    triage_cap_justified:
      expr: "!(union_raw_count > max_active_dimensions && triage_overrides == [])"
      on_fail: reject_triage
    split_recommendation_is_suspension:
      expr: "triage_split_recommendation == null || verdict.status == NECESITA_INFO"
      on_fail: reject_verdict
    suspension_reset_requires_both:
      expr: "suspension_cycles_reset_reason == null || suspension_cycles_reset_reason == 'artifact_hash_change_and_questions_resolved'"
      on_fail: reject_verdict
    skip_incident_forces_no_pasa:
      expr: "summary_metrics.active_skip_incidents == 0 || verdict.status == NO_PASA"
      on_fail: reject_verdict
# --- Enforcement de esquema ---
schema_enforcement:
  version: "3.4.0"
  conditional_rules:
    - id: G1
      schema: verdict
      rule: "state_class == OPERATIONAL_SUSPENSION ⇒ suspension_control objeto no-null"
      enforced_by: "schema/verdict.yaml allOf[0]"
    - id: G1-bis
      schema: verdict
      rule: "state_class == TERMINAL ⇒ suspension_control null"
      enforced_by: "schema/verdict.yaml allOf[1]"
    - id: G2
      schema: verdict
      rule: "status ∈ {PASA, PASA_CON_CONDICIONES} ⇒ audit_trail_passed_checks minItems:1"
      enforced_by: "schema/verdict.yaml allOf[2]"
    - id: I3
      schema: verdict
      rule: "reason_code == GATE_SKIPPED ⇒ status == NO_PASA AND state_class == TERMINAL"
      enforced_by: "schema/verdict.yaml allOf[3]"
