  unmapped_stack_behavior:
    action: NECESITA_INFO
    suspension_reason: STACK_NOT_MAPPED
    question: "¿Qué macro-perfil aplica a este stack?"
  # I2 + M-B — Cascada de plan padre-hijo
  plan_cascade:
    enabled: true
    on_step_blocked:
      action: block_downstream_steps
      notify_gate_c: true
    on_all_steps_passed:
      action: close_plan
      notify_gate_c: true
    triage_behavior_on_blocked_plan: NECESITA_INFO
    suspension_reason: PLAN_BLOCKED
  # I3 — Detección de gate saltado
  skip_detection:
    enabled: true
    source: check_encargo_v2
    on_active_skip_incident:
      action: force_no_pasa
      reason_code: GATE_SKIPPED
      policy_ref: P21
  # M-C — Contrato de check_encargo
  check_encargo_contract:
    version: "2.0"
    input:
      - "bitacora-gate-b.jsonl"
      - "artifacts_manifest.jsonl"
    output:
      - "skip_incident.yaml (uno por gate faltante)"
    invocation: "check_encargo v2 --bitacora <path> --manifest <path> --out <path>"
    expected_behavior: |
      Para cada artefacto del manifest con expected_gate == GATE_B,
      si no existe veredicto terminal en bitácora, emite SKIP_INCIDENT.
      El Crítico consume esos SKIP_INCIDENT en su siguiente revisión.
  # M-D — Rotación de modelos
  model_rotation:
    enabled: false
    policy: round_robin
    max_consecutive_reviews_per_model: 3
    prohibited_same_model_for:
      - author_and_reviewer
      - reviewer_and_verifier
    audit_field: "provenance.model_version"
