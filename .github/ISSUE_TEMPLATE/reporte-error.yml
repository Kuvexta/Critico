name: Reporte de error
description: Reportar un fallo del Crítico (CLI, batería, esquemas, skill)
title: "Error: "
labels: ["error"]
body:
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: "Release 00.02.03 · v3.4.0"
    validations:
      required: true
  - type: textarea
    id: entorno
    attributes:
      label: Entorno
      placeholder: "SO, Python (python3 --version), dependencias"
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: salida
    attributes:
      label: Salida observada
      placeholder: "Pega el comando y su salida (sin secretos)."
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
