name: Critico CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ratchet_baseline:
        description: 'Línea base del ratchet para SIMULACIÓN (vacío = docs/SUITE_BASELINE). Un valor alto debe hacer FALLAR el gate — prueba de la bajada en CI.'
        required: false
        default: ''

jobs:
  bateria-freeze-guarda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0   # gitleaks revisa el historial completo
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install -r requirements.txt
      - name: Historical 153-test suite (tests/)
        run: |
          pip install pytest jsonschema PyYAML
          PYTHONDONTWRITEBYTECODE=1 python -B -m pytest tests/ -q
      - name: Suite ratchet (BUP-RATCHET-01 — el umbral solo sube)
        env:
          RATCHET_BASELINE: ${{ inputs.ratchet_baseline }}
        run: PYTHONDONTWRITEBYTECODE=1 python -B scripts/ratchet_suite.py
      - name: Batería completa
        run: PYTHONDONTWRITEBYTECODE=1 python -B probar_todo.py
      - name: Freeze
        run: PYTHONDONTWRITEBYTECODE=1 python -B scripts/verify_freeze.py
      - name: Guarda de release
        run: PYTHONDONTWRITEBYTECODE=1 python -B scripts/verificar_release.py
      - name: Variantes de la skill (generador --check, byte a byte)
        run: PYTHONDONTWRITEBYTECODE=1 python -B scripts/package_cli_ide_skills.py --check
      - name: Manifest del artefacto (--check)
        run: PYTHONDONTWRITEBYTECODE=1 python -B scripts/build_manifest.py --check
      - name: Escaneo público — gitleaks (secretos, historial completo)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact .
      - name: Escaneo público — correos, NIT, nombres e IDs internos (línea base)
        run: PYTHONDONTWRITEBYTECODE=1 python -B scripts/escaneo_publico.py
      - name: Golden set de contrato de la skill (vieja falla, nueva pasa)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B -m evals.cli --skill-version new --expect-all-pass --fail-on-regression --json
          if PYTHONDONTWRITEBYTECODE=1 python -B -m evals.cli --skill-version old --expect-all-pass --json; then echo "la skill v3.6.0 no debería pasar SC-001..003"; exit 1; fi
