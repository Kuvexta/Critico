name: Critico CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ratchet_baseline:
        description: 'Línea base del ratchet para SIMULACIÓN (vacío = docs/SUITE_BASELINE). Un valor alto debe hacer FALLAR el gate — prueba de la bajada en CI.'
        required: false
        default: ''

jobs:
  bateria-freeze-guarda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install -r requirements.txt
      - name: Historical 153-test suite (tests/)
        run: |
          pip install pytest jsonschema PyYAML
          PYTHONDONTWRITEBYTECODE=1 python -B -m pytest tests/ -q
      - name: Suite ratchet (BUP-RATCHET-01 — el umbral solo sube)
        env:
          RATCHET_BASELINE: ${{ inputs.ratchet_baseline }}
        run: PYTHONDONTWRITEBYTECODE=1 python -B scripts/ratchet_suite.py
      - name: Batería completa
        run: PYTHONDONTWRITEBYTECODE=1 python -B probar_todo.py
      - name: Freeze
        run: PYTHONDONTWRITEBYTECODE=1 python -B scripts/verify_freeze.py
      - name: Guarda de release
        run: PYTHONDONTWRITEBYTECODE=1 python -B scripts/verificar_release.py
