# ============================================================
# rubric.yaml — Crítico v3.5.0 (congelado; parche aditivo PROP-COSECHA-001)
# 108 dimensiones · 19 familias (A–S) · rúbricas 0–4
# ============================================================
rubric_version: 3.6.0
frozen: true
freeze_date: "2026-10-26"
total_dimensions: 108
families: [A, B, C, D, E, F, G, H, I, J, K, L, M, N, O, P, Q, R, S]

# La puntuación va de 0 (no verificable) a 4 (correcto con evidencia completa).
activation_legend:
  core: "siempre puntuada; N/A con motivo obligatorio"
  opt: "activada por flag"
  dom: "activada por domain_profile/sub-perfil"

# Continuidad histórica con los 11 ángulos de v1.
v1_angle_legend:
  1: Costos
  2: Seguridad (P11–P15)
  3: Datos/honestidad (P06–P10)
  4: Personas/autonomía (P16–P20)
  5: Dependencias
  6: UX/accesibilidad
  7: Legal/licencias (P14)
  8: Coordinación (P21–P25)
  9: Sesgo del autor
  10: Blast-radius
  11: Contratos e invariantes

# Nota v3.1: deduplicación resuelta (43/89, 44/91). Contenido sin cambios en v3.2/v3.3.
