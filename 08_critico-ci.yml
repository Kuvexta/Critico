name: Critico v3.3 CI

on:
  push:
    branches: [main, master]
    paths:
      - 'rubric.yaml'
      - 'critic.config.yaml'
      - 'schema/**'
      - 'migration/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'golden_set/**'
      - 'evals/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/critico-ci.yml'
  pull_request:
    paths:
      - 'rubric.yaml'
      - 'critic.config.yaml'
      - 'schema/**'
      - 'migration/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'golden_set/**'
      - 'evals/**'
      - 'scripts/**'

jobs:
  # ---------------------------------------------------------------
  # 1. Suite completa en matriz de Python
  # ---------------------------------------------------------------
  test:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Verificar freeze
        run: make verify-freeze

      - name: Ejecutar suite (153 tests)
        run: make test

      - name: Cobertura
        run: make cover

  # ---------------------------------------------------------------
  # 2. Un job por invariante — fallo localizado (14 entradas)
  # ---------------------------------------------------------------
  invariants:
    name: Invariante ${{ matrix.invariant }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        invariant: [M1, M2, M3, R1, R2, R4, G1, G2, I1, I2, I3, M-PROD, rubric, schemas]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - run: pip install -r tests/requirements.txt

      - name: Ejecutar ${{ matrix.invariant }}
        run: |
          case "${{ matrix.invariant }}" in
            M1)      make test-m1 ;;
            M2)      make test-m2 ;;
            M3)      make test-m3 ;;
            R1)      make test-r1 ;;
            R2)      make test-r2 ;;
            R4)      make test-r4 ;;
            G1)      make test-g1 ;;
            G2)      make test-g2 ;;
            I1)      make test-i1 ;;
            I2)      make test-i2 ;;
            I3)      make test-i3 ;;
            M-PROD)  make test-m-prod ;;
            rubric)  make test-rubric ;;
            schemas) make test-schemas ;;
          esac

  # ---------------------------------------------------------------
  # 3. Lint de YAML + Python
  # ---------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - run: pip install -r tests/requirements.txt ruff yamllint

      - name: yamllint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            schema/ rubric.yaml critic.config.yaml \
            .github/workflows/critico-ci.yml

      - name: ruff
        run: ruff check tests/ migration/ evals/ scripts/ || true   # warning-only al inicio

  # ---------------------------------------------------------------
  # 4. Evals + integridad del rubric (no-regresión)
  # ---------------------------------------------------------------
  evals:
    name: Golden Set evals
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - run: pip install -r tests/requirements.txt

      - name: Verificar freeze v3.3
        run: make verify-freeze

      - name: Integridad del rubric (106 dims · 19 familias)
        run: make test-rubric

      - name: Validar golden cases contra schema
        run: |
          python - <<'EOF'
          from evals.loader import load_schema, load_all, validate_case
          schema = load_schema()
          pairs = load_all(validate=False)
          for case, _ in pairs:
              validate_case(case, schema)
          print(f"OK {len(pairs)} casos validados")
          EOF

      - name: Evals offline con check de regresión
        run: make eval

  # ---------------------------------------------------------------
  # 5. Artefactos: panel + dashboard + comentario en PR
  # ---------------------------------------------------------------
  artifact:
    name: Panel + dashboard
    runs-on: ubuntu-latest
    needs: evals
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - run: pip install -r tests/requirements.txt

      - name: Generar panel HTML
        if: always()
        run: make eval-panel

      - name: Generar dashboard histórico
        if: always()
        run: make eval-history

      - name: Subir panel como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-panel-html
          path: panel-evals.html
          retention-days: 30

      - name: Subir dashboard como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-dashboard-html
          path: dashboard-evals.html
          retention-days: 30

      - name: Comentar enlace en PR (solo PRs)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const html = fs.readFileSync('panel-evals.html', 'utf8');
            const ok = html.includes('Sin regresiones');
            const body = ok
              ? '## ✅ Panel de evals — sin regresiones\n\nDescarga el artefacto `eval-panel-html` para ver el detalle.'
              : '## ⚠️ Panel de evals — regresiones detectadas\n\nDescarga el artefacto `eval-panel-html` para ver el detalle.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # ---------------------------------------------------------------
  # 6. Commit del snapshot histórico en main
  # ---------------------------------------------------------------
  snapshot:
    name: Commit snapshot histórico
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: evals
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - run: pip install -r tests/requirements.txt

      - name: Generar snapshot + dashboard
        run: make eval-history

      - name: Commit snapshot al repo
        run: |
          git config user.name "critico-ci[bot]"
          git config user.email "critico-ci[bot]@users.noreply.github.com"
          git add golden_set/history/
          if git diff --cached --quiet; then
            echo "Sin cambios de snapshot."
          else
            git commit -m "eval: snapshot histórico $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
